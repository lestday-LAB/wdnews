name: Minify CSS & Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - 'style/**/*.css'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  BUILD_DIR: .

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ---------- 压缩 CSS ----------
      - name: Install minifier (csso)
        run: npm install -g csso-cli

      - name: Minify CSS (exclude impact.css)
        run: |
          for file in style/*.css; do
            name=$(basename "$file")
            [ "$name" = "impact.css" ] && continue
            csso "$file" -o "style/${name%.css}.min.css"
          done

      - name: Commit minified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add style/*.min.css
          git diff --cached --quiet || git commit -m "chore(style): minify css"
          git push

      # ---------- 打包并部署 ----------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4