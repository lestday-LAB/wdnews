name: Minify CSS

on:
  push:
    paths:
      - 'style/**/*.css'
  workflow_dispatch:

jobs:
  minify:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install -g clean-css-cli

      - name: Minify CSS files
        run: |
          shopt -s globstar
          for file in style/**/*.css; do
            if [[ "$file" == *.min.css ]]; then
              continue
            fi

            minfile="${file%.css}.min.css"

            echo "Minifying $file → $minfile"
            cleancss "$file" -o "$minfile"

            sed -i 's/@import\(.*\)"\([^"]*\)\.css"/@import\1"\2.min.css"/g' "$minfile"
          done

      - name: Commit minified files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add style/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(css): auto minify css files"
            git push
          fi